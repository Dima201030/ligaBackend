<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Статус · Pairly API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Prata&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #eaece5;
      --canvas-deep: #e1e4d9;
      --surface: #ffffff;
      --ink: #23250f;
      --ink-soft: #4c4e38;
      --ink-muted: #7a7c66;
      --ink-faint: #9c9e88;
      --navy: #191b0a;
      --line: rgba(35, 37, 15, 0.16);
      --divider: rgba(35, 37, 15, 0.1);
      --positive: #3d6b3a;
      --positive-soft: #e4ebd8;
      --negative: #a23a22;
      --negative-soft: #f3e2da;
      --warning: #7d5a10;
      --warning-soft: #efe6cf;
      --sky: #d7e354;
      --font-sans: "Manrope", system-ui, sans-serif;
      --font-display: "Prata", "Times New Roman", Georgia, serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
    }

    .shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 12px;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin: 0 0 16px;
    }

    .lede {
      max-width: 38rem;
      color: var(--ink-soft);
      margin: 0 0 40px;
    }

    .rule {
      height: 1px;
      background: var(--line);
      border: 0;
      margin: 0 0 32px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin-bottom: 40px;
    }

    .summary > div {
      padding: 20px 0;
      border-right: 1px solid var(--divider);
    }
    .summary > div:last-child { border-right: 0; }
    .summary > div:not(:first-child) { padding-left: 24px; }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      line-height: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
    }

    .card {
      padding: 28px 0;
      border-bottom: 1px solid var(--divider);
    }
    .card:nth-child(odd) { padding-right: 28px; border-right: 1px solid var(--divider); }
    .card:nth-child(even) { padding-left: 28px; }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      margin: 0;
      line-height: 1.1;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space:nowrap;
    }
    .pill.ok { background: var(--positive-soft); color: var(--positive); }
    .pill.degraded { background: var(--warning-soft); color: var(--warning); }
    .pill.down { background: var(--negative-soft); color: var(--negative); }
    .pill.unknown { background: var(--canvas-deep); color: var(--ink-muted); }

    .meta {
      display: grid;
      gap: 8px;
      color: var(--ink-soft);
      font-size: 14px;
    }
    .meta row, .meta .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid var(--divider);
      padding-top: 8px;
    }
    .meta .k { color: var(--ink-muted); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
    .meta .v { font-variant-numeric: tabular-nums; }

    .footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--ink-faint);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      background: var(--ink-faint);
      vertical-align: middle;
    }
    .dot.ok { background: var(--positive); }
    .dot.degraded { background: var(--warning); }
    .dot.down { background: var(--negative); }

    .accent-line {
      width: 48px;
      height: 3px;
      background: var(--sky);
      margin: 0 0 28px;
    }

    @media (max-width: 720px) {
      .summary, .grid { grid-template-columns: 1fr; }
      .summary > div {
        border-right: 0;
        border-bottom: 1px solid var(--divider);
        padding-left: 0 !important;
      }
      .summary > div:last-child { border-bottom: 0; }
      .card:nth-child(odd), .card:nth-child(even) {
        padding-left: 0;
        padding-right: 0;
        border-right: 0;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">01 / Система</p>
    <div class="accent-line" aria-hidden="true"></div>
    <h1>Статус сервисов</h1>
    <p class="lede">
      Contour платформы Pairly: API на Go и PostgreSQL. Страница обновляется
      каждые 5 секунд. Секреты на экран не выводятся.
    </p>

    <div class="summary">
      <div>
        <div class="stat-label">Общий статус</div>
        <div class="stat-value" id="overall">—</div>
      </div>
      <div>
        <div class="stat-label">Проверок ok</div>
        <div class="stat-value" id="ok-count">—</div>
      </div>
      <div>
        <div class="stat-label">Последний опрос</div>
        <div class="stat-value" id="polled" style="font-size:1.35rem">—</div>
      </div>
    </div>

    <hr class="rule" />

    <section class="grid" id="services" aria-live="polite"></section>

    <footer class="footer">
      <span><span class="dot" id="live-dot"></span>Автообновление · 5 с</span>
      <span>liga-api · /status</span>
    </footer>
  </main>

  <script>
    const labels = {
      api: "API",
      database: "PostgreSQL",
    };

    function pillClass(status) {
      if (status === "ok") return "ok";
      if (status === "degraded") return "degraded";
      if (status === "down" || status === "error") return "down";
      return "unknown";
    }

    function statusText(status) {
      if (status === "ok") return "Работает";
      if (status === "degraded") return "Деградация";
      if (status === "down" || status === "error") return "Недоступен";
      return "Неизвестно";
    }

    function render(data) {
      const checks = data.checks || {};
      const keys = Object.keys(checks);
      const ok = keys.filter((k) => checks[k].status === "ok").length;

      document.getElementById("overall").textContent = statusText(data.status || "unknown");
      document.getElementById("ok-count").textContent = keys.length ? ok + " / " + keys.length : "—";
      document.getElementById("polled").textContent = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      document.getElementById("live-dot").className = "dot " + pillClass(data.status);

      const root = document.getElementById("services");
      root.innerHTML = keys.map((key) => {
        const c = checks[key] || {};
        const st = c.status || "unknown";
        const latency = typeof c.latency_ms === "number" ? c.latency_ms + " мс" : "—";
        const detail = c.detail ? String(c.detail) : "—";
        return (
          '<article class="card">' +
            '<div class="card-head">' +
              '<h2>' + (labels[key] || key) + '</h2>' +
              '<span class="pill ' + pillClass(st) + '">' + statusText(st) + '</span>' +
            '</div>' +
            '<div class="meta">' +
              '<div class="row"><span class="k">Код</span><span class="v">' + key + '</span></div>' +
              '<div class="row"><span class="k">Задержка</span><span class="v">' + latency + '</span></div>' +
              '<div class="row"><span class="k">Деталь</span><span class="v">' + detail + '</span></div>' +
            '</div>' +
          '</article>'
        );
      }).join("");
    }

    async function poll() {
      try {
        const t0 = performance.now();
        const res = await fetch("/api/health", { cache: "no-store" });
        const data = await res.json();
        if (!data.checks) {
          data.checks = {
            api: { status: res.ok ? "ok" : "down", latency_ms: Math.round(performance.now() - t0), detail: "http " + res.status },
          };
        } else if (data.checks.api && data.checks.api.latency_ms == null) {
          data.checks.api.latency_ms = Math.round(performance.now() - t0);
        }
        render(data);
      } catch (err) {
        render({
          status: "down",
          checks: {
            api: { status: "down", detail: "сеть / процесс" },
            database: { status: "unknown", detail: "нет ответа API" },
          },
        });
      }
    }

    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
